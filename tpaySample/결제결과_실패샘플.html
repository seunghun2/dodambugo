<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<link rel="stylesheet" type="text/css" href="common/css/innopay_shop.css" />
		<script type="text/javascript" src="common/js/jquery-2.1.4.min.js"></script>

		<title>상점 결제결과</title>
	</head>
	<body>
		<div class="innopay">
			<section class="innopay_wrap">
				<section class="success_notice">
					<div id="icon_x" class="result_icon"></div>
					<p>결제실패</p>
				</section>
				<ul class="payment_info top_info">

					</li>
					<li class="price_li">
						<div class="info_title">결제금액</div>

					</li>
				</ul>
				<ul class="payment_info">
					<li>
						<div class="info_title">상점명</div>
						<div>테스트 상점</div>
					</li>
					<li>
						<div class="info_title">구매자명</div>
						<div>홍길동</div>
					</li>
					<li>
						<div class="info_title">결제수단</div>
						<div>신용카드(현대카드)</div>
					</li>
					<li>
						<div class="info_title">결제결과</div>

					</li>
					<li>

					</li>
				</ul>
				<section class="btn_wrap">
					<a class="btn_gray btn" href="javascript:window.close()">닫기</a>
				</section>
			</section>
		</div>
	</body>

</html>
